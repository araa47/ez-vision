[project]
name = "ez-image"
version = "0.1.0"
description = "Image generation and editing skills for AI agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-auth>=2.62.0",
    "google-genai>=2.34.0",
    "httpx>=0.27.0",
    "pillow>=13.0.0",
    "typer>=0.27.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17.3",
    "prek>=0.5.9",
    "pytest",
    "pytest-asyncio>=1.4.1",
    "pytest-cov",
    "ty>=0.0.95",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "e2e: end-to-end tests that call real APIs (slow, requires credentials)",
]

[tool.coverage.run]
source = ["skills/ez-google-imagen/scripts"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.",
]

[tool.isort]
profile = "black"
src_paths = "tests"
line_length = 80
include_trailing_comma = true
multi_line_output = 3

[tool.ruff]
select = ["E", "F", "B"]
exclude = ["__pycache__", "terraform", ".git", ".venv"]
ignore = ["E501"]
